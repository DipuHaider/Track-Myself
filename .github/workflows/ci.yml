name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Types, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (locked)
        run: npm ci

      # next.config.ts sets typescript.ignoreBuildErrors, so `next build` skips type
      # validation entirely. This is the only thing that type-checks the project.
      - name: Type check
        run: npm run typecheck

      # `next build` does not run ESLint either (the integration was removed in Next 16).
      - name: Lint
        run: npm run lint

      - name: Every env var the code reads is documented
        run: npm run check:env

      # Pure-module unit tests (vitest). DB-backed suites live under *.dbtest.ts
      # and run in the test-db job against a MongoDB service container.
      - name: Unit tests
        run: npm test

      # Placeholders only. db.ts throws at import time if MONGODB_URI is unset, but the
      # build never opens a connection, so no real credentials are needed here.
      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci-placeholder
          NEXTAUTH_SECRET: ci-placeholder-value-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - run: npm ci

      # esbuild strips types without checking them, so this is the only place
      # the extension source is type-checked (@types/chrome is a dev dependency).
      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # manifest.json points at dist/*.js, icons/* and popup.html, so the
      # extension root is browser-extension/ — the zip must contain all four.
      - name: Package loadable extension
        run: |
          test -f dist/content.js
          test -f dist/background.js
          test -f dist/popup.js
          test -f popup.html
          mkdir -p ../ext-package
          cp -r manifest.json popup.html dist icons ../ext-package/

      # Every file the manifest references must exist in the package, or the
      # extension installs and then fails at the first click.
      - name: Packaged files match the manifest
        run: |
          cd ../ext-package
          node -e '
            const m = require("./manifest.json");
            const fs = require("fs");
            const refs = [
              m.background.service_worker,
              m.action.default_popup,
              ...m.content_scripts.flatMap(c => c.js),
              ...Object.values(m.icons),
            ];
            const missing = refs.filter(f => !fs.existsSync(f));
            if (missing.length) { console.error("missing:", missing); process.exit(1); }
            console.log("all " + refs.length + " referenced files present");
          '

      - name: Manifest and package versions agree
        run: |
          m=$(node -p "require('./manifest.json').version")
          p=$(node -p "require('./package.json').version")
          echo "manifest=$m package=$p"
          test "$m" = "$p"

      - uses: actions/upload-artifact@v4
        with:
          name: trackmyself-extension
          path: ext-package
          if-no-files-found: error

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - run: npm ci
      - run: npm run build

      # Start the server over stdio and check it answers initialize and lists
      # its tools; a broken SDK upgrade fails here rather than in a client.
      - name: Handshake
        env:
          TRACKMYSELF_TOKEN: tm_pat_ci
          TRACKMYSELF_URL: http://localhost:3000
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 15 node dist/index.js > out.jsonl || true
          node -e '
            const lines = require("fs").readFileSync("out.jsonl", "utf8").trim().split("\n").map(JSON.parse);
            const tools = lines.find(l => l.id === 2)?.result?.tools ?? [];
            console.log(tools.map(t => t.name).join(", "));
            if (tools.length < 10) process.exit(1);
          '

  test-db:
    name: Database-backed tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Suites under src/**/*.dbtest.ts. The job passes trivially until the
      # first one exists; it is here so adding one needs no CI change.
      - name: DB tests
        run: npm run test:db -- --passWithNoTests
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/trackmyself-ci
          NEXTAUTH_SECRET: ci-placeholder-value-not-a-real-secret
          AI_KEY_SECRET: ci-placeholder-ai-key-secret-32chars

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Blocks only on critical. The 4 standing "high" advisories are transitive under
      # @huggingface/transformers with no upstream fix and are browser-only; they are
      # reported here rather than blocking every build.
      - name: Fail on critical advisories
        run: npm audit --audit-level=critical

      - name: Report high and below
        if: always()
        run: npm audit || true
